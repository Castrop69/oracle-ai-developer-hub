<!doctype html>
<html>

          <polygon points="356,258 256,308 256,238 356,188" fill="#c98500"/>
          <polygon points="256,238 356,188 256,138 156,188" fill="#ffd35c"/>

          <line x1="256" y1="138" x2="256" y2="86"/>
          <line x1="256" y1="86" x2="380" y2="86"/>
          <line x1="380" y1="86" x2="380" y2="118"/>
